name: Bug report
description: Report a reproducible SkillHone defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve SkillHone. Never paste API keys or private prompts.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal commands and public inputs that reproduce the problem.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Git, DeepSeek Harness, and Agent runtime versions.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private prompts, and private repository paths.
          required: true
