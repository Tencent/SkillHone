name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=low --registry=https://registry.npmjs.org/
      - run: npm audit signatures --registry=https://registry.npmjs.org/
      - name: Audit the pinned Harness dependency tree without running lifecycle scripts
        run: |
          mkdir "${RUNNER_TEMP}/dsh-audit"
          pnpm add --dir "${RUNNER_TEMP}/dsh-audit" --save-exact --ignore-scripts \
            @deepseek-ai/dsh@0.1.5-rc.2
          pnpm --dir "${RUNNER_TEMP}/dsh-audit" audit \
            --audit-level=low --registry=https://registry.npmjs.org/
          npm audit signatures --prefix "${RUNNER_TEMP}/dsh-audit" \
            --registry=https://registry.npmjs.org/
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r skills/skillhone/assets/requirements.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
