name: Close inactive issues

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: 14
          days-before-issue-close: 7
          stale-issue-label: "needs-response"
          stale-issue-message: >
            This issue has been inactive for 14 days. It will be closed in 7 days
            if there is no further activity.
          close-issue-message: >
            This issue was closed because it has been inactive after being marked as stale.
          exempt-issue-labels: "bug,enhancement,good first issue,help wanted"
          days-before-pr-stale: -1
          days-before-pr-close: -1
