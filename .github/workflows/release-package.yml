name: Release package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: npm pack --pack-destination release
      - run: |
          mkdir install-root
          npm install -g --ignore-scripts --prefix "$PWD/install-root" ./release/skillhone-cli-*.tgz
          "$PWD/install-root/bin/skillhone" --version
          "$PWD/install-root/bin/skillhone" doctor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skillhone-installation-bundle
          path: release/*

  publish:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skillhone-installation-bundle
          path: release
      - name: Attach the verified package to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release/* --clobber
